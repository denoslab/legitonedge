[project]
name = "legit-edge"
version = "0.1.0"
description = "LegitOnEdge: benchmarking the reliability of agentic small language models on edge hardware"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "The LegitOnEdge authors" }]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "pydantic>=2.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "datasets>=2.20",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
jetson = []
spark = ["vllm>=0.5.0"]
energy = ["adafruit-circuitpython-ina260>=1.3.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
legit-edge = "legit_edge.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legit_edge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "requires_datasets: needs pinned workload JSONLs (run `legit-edge pin datasets`)",
]
